<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>全景图POI戳点样式Demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; }
#panorama { width: 100vw; height: 100vh; }

/* 隐藏默认热点样式 */
.pnlm-hotspot { background: none !important; border: none !important; width: auto !important; height: auto !important; }
.pnlm-hotspot .pnlm-sprite { display: none !important; }
.pnlm-tooltip { display: none !important; }

/* POI标签基础样式 */
.poi {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px 7px 10px;
    border-radius: 20px;
    font-size: 13px; font-weight: 500; font-family: "PingFang SC", -apple-system, sans-serif;
    white-space: nowrap;
    cursor: pointer;
    transition: transform 0.15s ease;
    pointer-events: auto;
}
.poi:hover { transform: scale(1.08); }

/* Pin图标 */
.poi .pin {
    width: 18px; height: 18px; min-width: 18px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
}
.poi .pin svg { width: 18px; height: 18px; }

/* 蓝色醒目样式 - 益丰大药房专用 */
.poi-blue {
    background: rgba(22, 115, 210, 0.95);
    color: #fff;
    font-size: 14px; font-weight: 600;
    padding: 8px 16px 8px 12px;
    box-shadow: 0 2px 12px rgba(22, 115, 210, 0.5);
}

/* 白色常规样式 - 其他POI */
.poi-white {
    background: rgba(255, 255, 255, 0.92);
    color: #333;
    box-shadow: 0 1px 6px rgba(0,0,0,0.25);
}

/* 圆形图标样式 */
.poi-icon {
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 4px;
    cursor: pointer;
    transition: transform 0.15s ease;
    pointer-events: auto;
}
.poi-icon:hover { transform: scale(1.1); }
.poi-icon .circle {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
.poi-icon .label {
    font-size: 11px; font-weight: 500;
    font-family: "PingFang SC", sans-serif;
    color: #fff;
    background: rgba(0,0,0,0.55);
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
}

.top-bar {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.5); color: #fff;
    padding: 10px 20px; font-size: 13px; z-index: 999;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "PingFang SC", sans-serif;
}
.top-bar .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; margin-left: 8px;
}
.badge-blue { background: rgba(22, 115, 210, 0.9); }
.badge-white { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div class="top-bar">
    <span>18号线 上海财经大学站 4号口 全景图</span>
    <span>
        <span class="badge badge-blue">蓝色 = 新样式</span>
        <span class="badge badge-white">白色 = 原样式</span>
    </span>
</div>
<div id="panorama"></div>

<script>
// 蓝色圆形+建筑图标（中国电信/优印堂/同济欣苑）
var svgBuilding = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="10" width="16" height="11" rx="1" fill="white"/><rect x="9" y="4" width="6" height="7" rx="1" fill="white"/><rect x="9" y="14" width="2.5" height="3.5" rx="0.5" fill="#4A9BE8"/><rect x="12.5" y="14" width="2.5" height="3.5" rx="0.5" fill="#4A9BE8"/><rect x="7" y="13" width="2" height="2" rx="0.3" fill="#4A9BE8"/><rect x="15" y="13" width="2" height="2" rx="0.3" fill="#4A9BE8"/></svg>';

// 紫色圆形+购物袋图标（罗森便利店/绿源电动车）
var svgBag = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 9h12l-1.5 10H7.5L6 9z" fill="white"/><path d="M9 9V7a3 3 0 016 0v2" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>';

// 带图标的圆形POI
function makeCirclePOI(div, svgIcon, text, bgColor) {
    div.innerHTML = '<div class="poi-icon">' +
        '<div class="circle" style="background:' + bgColor + ';width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.35);">' +
        '<div style="width:26px;height:26px;">' + svgIcon + '</div>' +
        '</div>' +
        '<div class="label">' + text + '</div>' +
        '</div>';
}

// 益丰大药房专用蓝色文字标签
var pinWhite = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="currentColor"/><circle cx="12" cy="9" r="2.5" fill="white"/></svg>';
function makePOI(div, text, style) {
    div.innerHTML = '<div class="poi poi-' + style + '">' +
        '<span class="pin" style="color:#fff">' + pinWhite + '</span>' +
        text + '</div>';
}

var viewer = pannellum.viewer('panorama', {
    type: 'equirectangular',
    panorama: 'https://ai-real-scene.oss-cn-zhangjiakou-gd.aliyuncs.com/project_out/publish/1116430471/pano-merge/1022331-BX10035459/v1/panorama.png',
    autoLoad: true,
    compass: false,
    showZoomCtrl: true,
    showFullscreenCtrl: true,
    hfov: 100,
    pitch: 5,
    yaw: -130,
    minHfov: 50,
    maxHfov: 120,
    hotSpotDebug: false,

    hotSpots: [
        // ===== 益丰大药房 - 蓝色文字标签 =====
        {
            pitch: 7, yaw: -131, type: 'info',
            createTooltipFunc: function(div) { makePOI(div, '益丰大药房 (政立路)', 'blue'); }
        },
        // ===== 蓝色圆形+建筑图标 =====
        {
            pitch: 7, yaw: -168, type: 'info',
            createTooltipFunc: function(div) { makeCirclePOI(div, svgBuilding, '中国电信', '#4A9BE8'); }
        },
        {
            pitch: 7, yaw: -150, type: 'info',
            createTooltipFunc: function(div) { makeCirclePOI(div, svgBuilding, '优印堂数码印刷', '#4A9BE8'); }
        },
        // ===== 紫色圆形+购物袋图标 =====
        {
            pitch: 7, yaw: -108, type: 'info',
            createTooltipFunc: function(div) { makeCirclePOI(div, svgBag, '罗森便利店', '#9C4FD4'); }
        },
        {
            pitch: 7, yaw: -83, type: 'info',
            createTooltipFunc: function(div) { makeCirclePOI(div, svgBag, '绿源电动车', '#9C4FD4'); }
        },
        // ===== 蓝色圆形+建筑图标（同济欣苑）=====
        {
            pitch: 28, yaw: -138, type: 'info',
            createTooltipFunc: function(div) { makeCirclePOI(div, svgBuilding, '同济欣苑', '#4A9BE8'); }
        }
    ]
});
</script>
</body>
</html>
